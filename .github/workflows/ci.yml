name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # The app runs on PostgreSQL; SQLite (the default test database) doesn't
    # enforce VARCHAR lengths, which let a String(10) overflow reach the live
    # dashboard in Nov 2026. The suite runs on both.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: alphalens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Audit dependencies for known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit

      - name: Static analysis (ruff, error-class rules only)
        # Syntax errors and true bugs only - no style opinion; the codebase
        # predates a linter and a full ruleset would fail on cosmetic noise.
        run: |
          pip install ruff
          ruff check --select=E9,F app scripts main.py

      - name: Run tests (SQLite)
        run: python -m pytest -q

      - name: Run tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql://testuser:testpass@localhost:5432/alphalens_test
        # Page smoke tests render against their own SQLite file - run above.
        run: python -m pytest -q --deselect tests/test_page_smoke.py
