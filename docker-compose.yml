version: '3.8'

services:
  stock-analyzer:
    build: .
    container_name: stock-analyzer
    ports:
      # Bind to localhost only - the dashboard has no authentication, so
      # publishing on all interfaces would expose it to the LAN.
      - "127.0.0.1:8501:8501"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
